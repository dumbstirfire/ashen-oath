<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Ashen Oath | Prototype 01</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c12;color:#eee;font-family:Georgia,serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:start}#title{font-size:16px;letter-spacing:3px;color:#e4c8a1;text-shadow:0 2px 5px #000}#objective{font:12px system-ui;color:#d5d2c9;margin-top:7px}.bar{height:9px;width:145px;background:#2a2024;border:1px solid #89776e;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,#8d1f2a,#d74c49);width:100%}#stamina .fill{background:linear-gradient(90deg,#497b58,#8dbf85)}#message{position:absolute;top:23%;width:100%;text-align:center;font-size:19px;color:#efd5aa;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .3s}#joystick{position:absolute;left:23px;bottom:max(35px,env(safe-area-inset-bottom));width:118px;height:118px;border:2px solid #ffffff40;border-radius:50%;background:#ffffff12;pointer-events:auto;touch-action:none}#knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#cbbda35c;border:2px solid #ffffff66}#actions{position:absolute;right:18px;bottom:max(36px,env(safe-area-inset-bottom));display:flex;align-items:end;gap:12px;pointer-events:auto}button{border:1px solid #b3a18d;background:#222630c9;color:#f5e9d5;border-radius:50%;font:700 12px system-ui;letter-spacing:1px;touch-action:none}#attack{width:86px;height:86px;background:#733b36c9}#dodge{width:70px;height:70px}#lock{width:55px;height:55px}#hint{position:absolute;bottom:max(166px,calc(env(safe-area-inset-bottom) + 144px));left:16px;font:11px system-ui;color:#d1c6b8a8;max-width:200px}#enemyUI{position:absolute;top:65px;left:50%;transform:translateX(-50%);text-align:center;display:none;font:12px system-ui;letter-spacing:1px}#enemyUI .bar{width:180px}#restart{position:absolute;top:54%;left:50%;transform:translateX(-50%);border-radius:8px;padding:13px 22px;display:none;pointer-events:auto}#error{position:absolute;top:35%;left:10%;right:10%;text-align:center;color:#ffb0a0;font:14px system-ui}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}</script></head><body><div id="hud"><div id="top"><div><div id="title">ASHEN OATH</div><div id="objective">Defeat the Grave Warden</div></div><div><div style="font:11px system-ui">VIGOR</div><div class="bar"><div class="fill" id="hp"></div></div><div style="font:11px system-ui;margin-top:5px">STAMINA</div><div class="bar" id="stamina"><div class="fill" id="sp"></div></div></div></div><div id="enemyUI">GRAVE WARDEN<div class="bar"><div class="fill" id="ehp"></div></div></div><div id="message"></div><div id="hint">Left stick: move · Drag right side: look<br>ATTACK: strike · ROLL: evade</div><div id="joystick"><div id="knob"></div></div><div id="actions"><button id="lock">LOCK</button><button id="dodge">ROLL</button><button id="attack">ATTACK</button></div><button id="restart">RISE AGAIN</button><div id="error"></div></div><script type="module">
import * as THREE from 'three';
try {
const scene=new THREE.Scene();scene.background=new THREE.Color(0x141a22);scene.fog=new THREE.FogExp2(0x141a22,.032);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,130);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x899ab4,0x202017,1.6));const moon=new THREE.DirectionalLight(0xadb9db,2.3);moon.position.set(-8,18,-10);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);moon.shadow.camera.left=-35;moon.shadow.camera.right=35;moon.shadow.camera.top=35;moon.shadow.camera.bottom=-35;scene.add(moon);
const mat=(c,metal=0)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:.7});const stone=mat(0x3c4145),dark=mat(0x20262c,.65),iron=mat(0x666f78,.85),gold=mat(0x9c7950,.6),red=mat(0x542e2e),ground=mat(0x262d2a);const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),ground);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cylinder(rt,rb,h,m,x,y,z,parent=scene,n=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
const obstacles=[];for(let i=0;i<22;i++){let a=i/22*Math.PI*2,r=20+(i%3)*2,x=Math.sin(a)*r,z=Math.cos(a)*r;box(2.4,2+(i%4)*1.2,2.4,stone,x,1,z);obstacles.push({x,z,r:1.8})}for(let i=0;i<18;i++){let a=i*2.4,r=8+(i%4)*3,x=Math.sin(a)*r,z=Math.cos(a)*r;if(Math.abs(x)<4&&Math.abs(z+4)<6)continue;cylinder(.55,.7,1.2+ i%3,stone,x,.65,z);box(1.4,.25,1.4,stone,x,1.3+i%3,z);obstacles.push({x,z,r:1})}for(let i=0;i<70;i++){let a=i*9.4,r=4+(i*13%37),x=Math.sin(a)*r,z=Math.cos(a)*r;const peb=box(.2+(i%4)*.13,.1,.2+(i%3)*.12,stone,x,.05,z);peb.rotation.y=a}
const altar=cylinder(1.5,1.8,.6,stone,0,.3,-13,12);const flameMat=new THREE.MeshBasicMaterial({color:0xe17845});const fire=cylinder(.18,.4,1.5,flameMat,0,1.3,-13,6);const fireLight=new THREE.PointLight(0xf17736,20,12);fireLight.position.set(0,1.6,-13);scene.add(fireLight);
function knight(enemy=false){let root=new THREE.Group();scene.add(root);const armor=enemy?mat(0x3c403e,.8):iron,trim=enemy?mat(0x6c4b38,.6):gold;box(.85,1.1,.5,armor,0,1.55,0,root);box(.67,.23,.58,trim,0,2.15,0,root);const helm=cylinder(.34,.32,.56,armor,0,2.42,0,root,8);box(.53,.09,.09,dark,0,2.43,-.32,root);const crest=box(.12,.23,.55,trim,0,2.8,0,root);box(.36,.68,.38,armor,-.64,1.6,0,root);box(.36,.68,.38,armor,.64,1.6,0,root);box(.3,.72,.34,armor,-.24,.56,0,root);box(.3,.72,.34,armor,.24,.56,0,root);const cape=box(.8,1.25,.09,enemy?dark:red,0,1.4,.36,root);const sword=new THREE.Group();root.add(sword);sword.position.set(.86,1.15,-.12);box(.13,1.55,.1,iron,0,-.72,-.3,sword);box(.48,.12,.17,trim,0,-.02,-.3,sword);box(.14,.4,.15,dark,0,.21,-.3,sword);return {root,sword,cape}}
const hero=knight();hero.root.position.set(0,0,5);const foe=knight(true);foe.root.position.set(0,0,-7);foe.root.rotation.y=Math.PI;
let hp=100,sp=100,ehp=100,dead=false,won=false,lock=true,attacking=0,rolling=0,invuln=0,enemyAttack=0,enemyCooldown=1.5,attackCooldown=0,stun=0,camYaw=0,joyX=0,joyY=0,clock=new THREE.Clock(),elapsed=0;const $=id=>document.getElementById(id);$('enemyUI').style.display='block';
function msg(s){$('message').textContent=s;$('message').style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>$('message').style.opacity=0,1700)}msg('THE GRAVE WARDEN AWAITS');
function strike(){if(dead||won||attackCooldown>0||rolling>0||sp<22)return;sp-=22;attacking=.38;attackCooldown=.56;const dist=hero.root.position.distanceTo(foe.root.position);const toward=new THREE.Vector3(Math.sin(hero.root.rotation.y),0,Math.cos(hero.root.rotation.y));const to=foe.root.position.clone().sub(hero.root.position).normalize();if(dist<3.2&&toward.dot(to)>.25&&ehp>0){ehp=Math.max(0,ehp-25);stun=.35;msg(ehp===0?'WARDEN VANQUISHED':'STEEL FINDS ITS MARK');if(ehp===0){won=true;$('restart').style.display='block';$('restart').textContent='PLAY AGAIN'}}}
function roll(){if(dead||won||rolling>0||sp<30)return;sp-=30;rolling=.55;invuln=.48}
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();strike()});$('dodge').addEventListener('pointerdown',e=>{e.preventDefault();roll()});$('lock').addEventListener('pointerdown',e=>{e.preventDefault();lock=!lock;msg(lock?'TARGET LOCKED':'FREE CAMERA')});$('restart').onclick=()=>location.reload();
const joy=$('joystick'),knob=$('knob');let jid=null;function setJoy(e){let b=joy.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),d=Math.hypot(dx,dy),s=Math.min(d,44)/(d||1);joyX=dx*s/44;joyY=dy*s/44;knob.style.transform=`translate(${dx*s}px,${dy*s}px)`}joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(jid);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)setJoy(e)});function endJoy(e){if(e.pointerId===jid){jid=null;joyX=joyY=0;knob.style.transform=''}}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
let lookId=null,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.45){lookId=e.pointerId;lastX=e.clientX;renderer.domElement.setPointerCapture(lookId)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookId&&!lock){camYaw-=(e.clientX-lastX)*.007;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')roll();if(e.key.toLowerCase()==='j')strike()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function move(obj,dx,dz){const x=THREE.MathUtils.clamp(obj.position.x+dx,-24,24),z=THREE.MathUtils.clamp(obj.position.z+dz,-24,24);if(!obstacles.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.38)){obj.position.x=x;obj.position.z=z}}
function update(){const dt=Math.min(clock.getDelta(),.045);elapsed+=dt;if(!dead&&!won){sp=Math.min(100,sp+dt*18);attackCooldown=Math.max(0,attackCooldown-dt);attacking=Math.max(0,attacking-dt);rolling=Math.max(0,rolling-dt);invuln=Math.max(0,invuln-dt);stun=Math.max(0,stun-dt);let x=joyX+(keys.d?1:0)-(keys.a?1:0),y=joyY+(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(x,y);if(l>.12){x/=Math.max(1,l);y/=Math.max(1,l);let dir=camYaw;const vx=x*Math.cos(dir)+(-y)*Math.sin(dir),vz=-x*Math.sin(dir)+(-y)*Math.cos(dir);const speed=rolling>0?10:4.4;move(hero.root,vx*speed*dt,vz*speed*dt);if(lock){hero.root.rotation.y=Math.atan2(foe.root.position.x-hero.root.position.x,foe.root.position.z-hero.root.position.z)}else hero.root.rotation.y=Math.atan2(vx,vz);hero.root.position.y=Math.sin(elapsed*12)*.055}else hero.root.position.y=0;
if(lock){const to=foe.root.position.clone().sub(hero.root.position);camYaw=THREE.MathUtils.lerp(camYaw,Math.atan2(to.x,to.z),Math.min(1,dt*3))}if(attacking>0)hero.sword.rotation.z=-Math.sin((.38-attacking)/.38*Math.PI)*1.6;else hero.sword.rotation.z=0;
const dist=hero.root.position.distanceTo(foe.root.position);if(ehp>0&&stun<=0){foe.root.rotation.y=Math.atan2(hero.root.position.x-foe.root.position.x,hero.root.position.z-foe.root.position.z);enemyCooldown-=dt;if(dist>2.2&&dist<17){move(foe.root,Math.sin(foe.root.rotation.y)*dt*1.6,Math.cos(foe.root.rotation.y)*dt*1.6)}if(dist<2.7&&enemyCooldown<=0){enemyAttack=.65;enemyCooldown=2.1}if(enemyAttack>0){enemyAttack-=dt;foe.sword.rotation.z=-Math.sin((.65-enemyAttack)/.65*Math.PI)*1.5;if(enemyAttack<.29&&enemyAttack>.29-dt&&dist<3&&invuln<=0){hp=Math.max(0,hp-23);msg('THE WARDEN STRIKES');if(hp===0){dead=true;$('restart').style.display='block';msg('YOU HAVE FALLEN')}}}else foe.sword.rotation.z=0}}
$('hp').style.width=hp+'%';$('sp').style.width=sp+'%';$('ehp').style.width=ehp+'%';}
fire.scale.y=.82+Math.sin(elapsed*9)*.16;fire.rotation.y+=dt;const target=hero.root.position.clone().add(new THREE.Vector3(-Math.sin(camYaw)*6,4.3,-Math.cos(camYaw)*6));camera.position.lerp(target,Math.min(1,dt*5));camera.lookAt(hero.root.position.x,1.6,hero.root.position.z);renderer.render(scene,camera);requestAnimationFrame(update)}update();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){document.getElementById('error').textContent='Unable to start 3D scene: '+e.message;console.error(e)}
</script></body></html>
